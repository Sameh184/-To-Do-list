<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" aria-labelledby="title">
    <div class="header">
      <h1 id="title"><span class="dot" aria-hidden="true"></span> To-Do List</h1>
    </div>

    <div class="controls" role="group" aria-label="Add a new task">
      <input id="taskInput" type="text" placeholder="Add a task and press Enter" autocomplete="off" aria-label="Task description" />
      <button id="addBtn" class="btn" type="button">Add Task</button>
    </div>

    <div class="stats" id="stats" aria-live="polite"></div>

    <ul id="taskList" aria-label="Tasks"></ul>
    <div id="emptyState" class="empty">No tasks yet</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
